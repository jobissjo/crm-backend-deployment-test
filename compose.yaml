services:
  db:
    image: postgres:17
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - crm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    image: async-crm:local
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://crm:crm@db:5432/crm
    volumes:
      - ./app:/app/app:ro
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true
  api:
    build: .
    image: async-crm:local
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://crm:crm@db:5432/crm
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./app:/app/app:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  crm_data:
